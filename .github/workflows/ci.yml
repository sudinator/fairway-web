name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read
  packages: read   # 212.16: signed-in downloads of the Supabase images from ghcr.io (see "Sign in to the container registry")

# Independent read-only lanes run on separate filesystems/runners. No tests are skipped.
jobs:
  database:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      # The fresh-DB provider/freshness harness compiles the actual app helpers.
      # Keep its TypeScript/runtime dependencies even though this is the SQL lane.
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          # Kept on 2.101.0 (209.2): its image matches the hosted databases' grants. 2.111.0's newer image no longer
          # grants service_role on tables by default, unlike staging/production. Its supautils crash is avoided by
          # never calling a revoked function in tests (208.4). The rebuild prints the exact image tag.
          version: 2.101.0

      - name: Install PostgreSQL client
        run: |
          # Skip the apt fetch when psql is already present. GitHub's ubuntu-latest
          # image ships PostgreSQL, so this usually costs ~0s instead of an apt round
          # trip. On 2026-08-19 this step stalled 8m41s on azure.archive.ubuntu.com
          # (dozens of Ign: retries) — nothing was computing, it was waiting on a
          # mirror. Falls back to the original install if psql really is missing, so
          # the worst case is identical to the previous behaviour.
          if command -v psql >/dev/null 2>&1; then
            echo "psql already present: $(psql --version)"
          else
            echo "psql not found - installing postgresql-client"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi

      # 212.16: sign in to GitHub's container registry with the run's own token — anonymous image downloads are the ones
      # rate-limited ("toomanyrequests"); signed-in downloads have far more headroom. No secret needed.
      # 212.18: keep the Supabase images between runs — the registry (ghcr.io) rate-limits downloads, and the CLI needs
      # several images (postgres, realtime …). Keyed on the pinned CLI version above (2.101.0): the same images every run,
      # re-saved automatically when the CLI is upgraded. KEEP THE KEY'S VERSION IN STEP WITH `version:` ABOVE.
      - name: Restore the saved Supabase images
        id: sbimages
        uses: actions/cache/restore@v4
        with:
          path: /tmp/supabase-images.tar
          key: supabase-images-${{ runner.os }}-cli-2.101.0

      - name: Load the saved Supabase images
        if: steps.sbimages.outputs.cache-hit == 'true'
        run: docker load -i /tmp/supabase-images.tar

      - name: Sign in to the container registry (Supabase images)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Rebuild a fresh Supabase database from committed migrations
        run: node ci/time-command.cjs database bash ci/test_fresh_db_rebuild.sh

      - name: Save the Supabase images for later runs
        id: sbsave
        if: steps.sbimages.outputs.cache-hit != 'true'
        run: |
          imgs=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E 'supabase/' | grep -v '<none>' || true)
          if [ -n "$imgs" ]; then docker save $imgs -o /tmp/supabase-images.tar && ls -la /tmp/supabase-images.tar && echo "saved=true" >> "$GITHUB_OUTPUT"; fi

      - name: Store the saved Supabase images
        if: steps.sbsave.outputs.saved == 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/supabase-images.tar
          key: supabase-images-${{ runner.os }}-cli-2.101.0

      # The VAPID public key is NOT a secret — it ships to every browser in public/sw.js.
      # It is set here so `prebuild` can run its drift check instead of skipping it. Absence
      # is now a build failure (see scripts/check-vapid-key.mjs), so this must be present.
      - name: Verify live staging migration parity
        if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.head_ref == 'staging')
        env:
          BNN_STAGING_SUPABASE_URL: ${{ secrets.BNN_STAGING_SUPABASE_URL }}
          BNN_STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BNN_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: node ci/check_live_migration_parity.mjs staging

      - name: Save database timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-database-${{ github.run_attempt }}
          path: ci-timings/
          if-no-files-found: error

  application:
    runs-on: ubuntu-latest
    environment: staging
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.BNN_STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.BNN_STAGING_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY || 'BPosOVuEyjpY3zfcnhq_LP__z1IEs2_sgNPg9JNYG38_n54R5wpGgRx4cyq-lr5w9_UIdMC0Fn2bIocDJj9H0fc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps --only-shell
      - name: Timed application checks
        run: node ci/time-command.cjs application npm run ci:app
      - name: Save application timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-application-${{ github.run_attempt }}
          path: ci-timings/
          if-no-files-found: error

  charts:
    runs-on: ubuntu-latest
    environment: staging
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.BNN_STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.BNN_STAGING_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY || 'BPosOVuEyjpY3zfcnhq_LP__z1IEs2_sgNPg9JNYG38_n54R5wpGgRx4cyq-lr5w9_UIdMC0Fn2bIocDJj9H0fc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps --only-shell
      - name: Timed charts checks
        run: node ci/time-command.cjs charts npm run test:charts
      - name: Save charts timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-charts-${{ github.run_attempt }}
          path: ci-timings/
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    environment: staging
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.BNN_STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.BNN_STAGING_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY || 'BPosOVuEyjpY3zfcnhq_LP__z1IEs2_sgNPg9JNYG38_n54R5wpGgRx4cyq-lr5w9_UIdMC0Fn2bIocDJj9H0fc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Restore Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'next.config.mjs', 'tsconfig.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Timed build checks
        run: node ci/time-command.cjs build npm run build
      - name: Save build timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-build-${{ github.run_attempt }}
          path: ci-timings/
          if-no-files-found: error

  staging-integration:
    needs: [database, application, charts, build]
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    # Shared with the manual integration workflow. Never cancel a running cleanup.
    concurrency:
      group: bnn-staging-integration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Real staging integration gate
        env:
          BNN_STAGING_SUPABASE_URL: ${{ secrets.BNN_STAGING_SUPABASE_URL }}
          BNN_STAGING_SUPABASE_ANON_KEY: ${{ secrets.BNN_STAGING_SUPABASE_ANON_KEY }}
          BNN_STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BNN_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          BNN_STAGING_ALLOW_MUTATION: YES
          BNN_PRODUCTION_SUPABASE_PROJECT_REF: epmbsmykyrnoiccwnoxq
        run: npm run test:staging

  verify:
    # Keep the existing required check name. always() prevents a failed/skipped
    # prerequisite from silently skipping this final gate.
    if: always()
    needs: [database, application, charts, build, staging-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Require every applicable gate
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
          CI_REQUIRE_STAGING: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'staging' }}
        run: node ci/required-ci-results.cjs

  production-migration-parity:
    # Production credentials must never be exposed to code controlled by a pull request.
    # Pre-merge migration verification is performed explicitly in the release checklist;
    # this automated parity proof runs only after trusted code lands on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Verify live production migration parity
        env:
          BNN_PRODUCTION_SUPABASE_URL: ${{ secrets.BNN_PRODUCTION_SUPABASE_URL }}
          BNN_PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BNN_PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
        run: node ci/check_live_migration_parity.mjs production

      # 212.8: the security contract on production, read-only (migrations are applied to production before merging)
      - name: Security contract on production
        env:
          BNN_PRODUCTION_SUPABASE_URL: ${{ secrets.BNN_PRODUCTION_SUPABASE_URL }}
          BNN_PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BNN_PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node ci/fetch_security_contract_state.mjs production > /tmp/production-contract.json
          python3 ci/check_security_contract.py --state-json /tmp/production-contract.json

name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: staging

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.BNN_STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.BNN_STAGING_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: 2.101.0

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Rebuild a fresh Supabase database from committed migrations
        run: bash ci/test_fresh_db_rebuild.sh

      - run: npm run ci

name: External API Contracts

on:
  schedule:
    # DAILY now, not weekly. The job checks ten courses a run and skips anything verified in the
    # last seven days, so a full pass over the golden set takes about a week and then idles. Weekly
    # runs of the whole set used 31 of the provider's 35 daily requests in one go (0156).
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  golfcourseapi:
    runs-on: ubuntu-latest
    # The ledger lives in PRODUCTION (it is shared with the app, whose verifications land there), and
    # the production credentials are ENVIRONMENT secrets on this repo — so this job must declare the
    # environment or they resolve to empty strings with no warning. That silent-blank behaviour is
    # what made a Dependabot pull request look like a code failure for twenty minutes.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Verify GolfCourseAPI contract
        id: contract
        env:
          GOLF_API_KEY: ${{ secrets.GOLF_API_KEY }}
          # The freshness ledger (0156). Without these the job refuses to run rather than checking
          # every fixture and blowing the daily quota.
          #
          # Reuses the EXISTING production secrets rather than adding a duplicate pair to rotate.
          # They are environment-scoped, hence `environment: production` on this job above. If the
          # production environment restricts deployment branches, a run from another branch gets
          # blanks — the script then refuses to run and says so, rather than checking all 18 and
          # spending the day's quota.
          BNN_SUPABASE_URL: ${{ secrets.BNN_PRODUCTION_SUPABASE_URL }}
          BNN_SUPABASE_SERVICE_KEY: ${{ secrets.BNN_PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          node ci/external/golfcourseapi-contract.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 2 = monitor problem (missing key, rate limit, outage). 1 = real contract drift.
          # Both fail the job, but the alert issue below reports them differently so nobody
          # goes hunting for a provider change that never happened.
          exit $code

      - name: Open or update admin alert issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'External API contract alert: GolfCourseAPI';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            const code = '${{ steps.contract.outputs.exit_code }}';
            const monitorProblem = code === '2';
            const body = [
              monitorProblem
                ? '**The monitor could not run.** This is NOT evidence that the GolfCourseAPI contract changed.'
                : '**The GolfCourseAPI contract drifted.** The provider response no longer matches the golden fixtures.',
              '',
              monitorProblem
                ? [
                    'Usual causes, in order:',
                    '',
                    '1. `GOLF_API_KEY` missing or rejected. Repository secret (Settings -> Secrets and',
                    '   variables -> Actions). A separate copy lives in Vercel for the app itself.',
                    '2. DAILY QUOTA (HTTP 429, Retry-After in hours). The free tier allows 35 requests A DAY,',
                    '   shared with the app. Nothing to fix: wait for the reset. Do NOT re-run the workflow,',
                    '   which spends ten more. Use /api/courses?raw=1 (admin, ONE request) to check on it.',
                    '3. Ledger unreachable. This job runs in the `production` environment to read the',
                    '   BNN_PRODUCTION_* secrets; if that environment restricts branches, they arrive empty',
                    '   and the job refuses to run rather than checking all 18 and spending the budget.',
                    '4. Provider outage (HTTP 5xx).',
                    '',
                    'Read the step log for the exact reason. Do NOT change application code for this.',
                  ].join('\n')
                : 'Check provider ids, search/detail response shape, and required fields before changing application code.',
              '',
              `Workflow: ${context.workflow}`,
              `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

name: External API Contracts

on:
  schedule:
    # Daily. The set is the course LIBRARY (favorite_courses with a provider id), read at run time,
    # so it follows what members save (196.1). Eight courses a run, one request each, skipping
    # anything successfully verified in the last seven days: a 20-course library is re-verified
    # every three days inside the provider's 35 requests/day shared with the app.
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  golfcourseapi:
    runs-on: ubuntu-latest
    # The ledger lives in PRODUCTION (it is shared with the app, whose verifications land there), and
    # the production credentials are ENVIRONMENT secrets on this repo — so this job must declare the
    # environment or they resolve to empty strings with no warning. That silent-blank behaviour is
    # what made a Dependabot pull request look like a code failure for twenty minutes.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # The freshness step compiles lib/course-diff.ts with the repo's TypeScript.
      - run: npm ci --no-audit --no-fund

      - name: Verify GolfCourseAPI contract
        id: contract
        env:
          GOLF_API_KEY: ${{ secrets.GOLF_API_KEY }}
          # The library and the freshness ledger (0156, 196.1). Without these the job refuses to run.
          #
          # Reuses the EXISTING production secrets rather than adding a duplicate pair to rotate.
          # They are environment-scoped, hence `environment: production` on this job above. If the
          # production environment restricts deployment branches, a run from another branch gets
          # blanks — the script then refuses to run and says so, rather than checking all 18 and
          # spending the day's quota.
          BNN_SUPABASE_URL: ${{ secrets.BNN_PRODUCTION_SUPABASE_URL }}
          BNN_SUPABASE_SERVICE_KEY: ${{ secrets.BNN_PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          node ci/external/golfcourseapi-contract.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 2 = monitor problem (missing key, quota, outage, a 404 on one id, or a ledger write that
          # failed). 1 = real contract drift: the provider answered 200 and the content disagrees.
          # Both fail the job, but the alert issue below reports them differently so nobody goes
          # hunting for a provider change that never happened. Every course claimed by a run gets a
          # recorded outcome on EVERY exit path (0164); read the "Outcomes recorded" table in the
          # step log. A green run means every course checked today resolved with HTTP 200 and
          # matched its fixture — nothing less.
          exit $code

      - name: Diff fetched courses against the stored library (course freshness)
        # Runs even when the contract step failed: payloads saved before a quota/outage are still
        # worth diffing, and this step spends no provider requests. Its own failure (ledger down)
        # fails the job and is reported below as a monitor problem.
        if: always()
        env:
          BNN_SUPABASE_URL: ${{ secrets.BNN_PRODUCTION_SUPABASE_URL }}
          BNN_SUPABASE_SERVICE_KEY: ${{ secrets.BNN_PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
        run: node ci/external/course-freshness-sync.mjs

      - name: Open or update admin alert issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'External API contract alert: GolfCourseAPI';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            const code = '${{ steps.contract.outputs.exit_code }}';
            const monitorProblem = code === '2';
            const body = [
              monitorProblem
                ? '**The monitor could not run.** This is NOT evidence that the GolfCourseAPI contract changed.'
                : '**The GolfCourseAPI contract drifted.** A stored provider id resolved to a different course, or the payload lost its tees.',
              '',
              monitorProblem
                ? [
                    'Usual causes, in order:',
                    '',
                    '1. `GOLF_API_KEY` missing or rejected. Repository secret (Settings -> Secrets and',
                    '   variables -> Actions). A separate copy lives in Vercel for the app itself.',
                    '2. DAILY QUOTA (HTTP 429, Retry-After in hours). The free tier allows 35 requests A DAY,',
                    '   shared with the app. Nothing to fix: wait for the reset. Do NOT re-run the workflow,',
                    '   which spends eight more. Use /api/courses?raw=1 (admin, ONE request) to check on it.',
                    '3. Ledger unreachable. This job runs in the `production` environment to read the',
                    '   BNN_PRODUCTION_* secrets; if that environment restricts branches, they arrive empty',
                    '   and the job refuses to run rather than checking the whole library and spending the budget.',
                    '4. Provider outage (HTTP 5xx).',
                    '5. One course id answered 404 or another 4xx. It is recorded as `error` with the',
                    '   status and retried on the next run; if it persists the provider removed the id',
                    '   and the library course should be re-linked to the right provider course.',
                    '6. A ledger write failed. Courses may read `claimed` until the next run re-queues them.',
                    '',
                    'Read the "Outcomes recorded" table in the step log for the per-course status and',
                    'HTTP code. Do NOT change application code for this.',
                  ].join('\n')
                : 'Check the named course in Courses (its provider id) and the detail response shape before changing application code.',
              '',
              `Workflow: ${context.workflow}`,
              `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

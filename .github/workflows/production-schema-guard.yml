name: Production schema guard

# Production credentials are available only to trusted code after it lands on main.
# Pull requests and staging pushes prove the same contract against a disposable fresh database
# in CI / verify, without receiving any Production database credential.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: read

jobs:
  schema-guard:
    name: Database schema guard (read-only)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: |
          if command -v psql >/dev/null 2>&1; then
            echo "psql already present: $(psql --version)"
          else
            echo "psql not found - installing postgresql-client"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
      - name: Run Production schema guard
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash ci/schema-check.sh

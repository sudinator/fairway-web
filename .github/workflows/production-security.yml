name: Production security posture (nightly)

# 0182: every night, check that every public table on production has Row-Level Security and was
# created by a migration. A table made by hand (Supabase flagged two on 2026-10-11) fails this job,
# naming the table, and the failure opens a GitHub issue so it is seen within a day.
on:
  schedule:
    - cron: '30 7 * * *'   # 07:30 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  posture:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Verify production migrations and security posture
        id: check
        env:
          BNN_PRODUCTION_SUPABASE_URL: ${{ secrets.BNN_PRODUCTION_SUPABASE_URL }}
          BNN_PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BNN_PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
        run: node ci/check_live_migration_parity.mjs production
      - name: Open an issue when it fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Production security posture check failed';
            const open = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'security' });
            if (open.data.some((i) => i.title === title)) return;
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, labels: ['security'],
              body: `The nightly check found a public table on production with Row-Level Security off, or one not created by any migration. See the run log for the table name: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
